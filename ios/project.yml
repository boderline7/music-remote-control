name: CarRemote
options:
  bundleIdPrefix: com.carremote
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    # 编译时写死的默认车机 IP；GitHub Actions 的 default_host 输入会覆盖它。
    # App 内「连接设置」改过的地址优先，存在 UserDefaults 里。
    CAR_REMOTE_HOST: "192.168.43.1"
targets:
  CarRemote:
    type: application
    platform: iOS
    sources:
      - path: CarRemote
        excludes:
          - Info.plist
    info:
      path: CarRemote/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carremote.ios
        PRODUCT_NAME: CarRemote
        INFOPLIST_FILE: CarRemote/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 云构建默认出未签名 IPA，交给 Sideloadly / AltStore 用本机 Apple ID 签名安装。
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  CarRemote:
    build:
      targets:
        CarRemote: all
    run:
      config: Debug
    archive:
      config: Release
