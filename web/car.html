<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>车机控制</title>
<style>
  :root{
    --fg:#fff;
    --dim:rgba(255,255,255,.55);
    --faint:rgba(255,255,255,.32);
    --line:rgba(255,255,255,.12);
    --card:rgba(255,255,255,.06);
    --red:#fa2d48;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;color:var(--fg);overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(120% 60% at 50% 0%,#1b1b22 0%,#0b0b0d 62%) fixed;
    font-family:-apple-system,system-ui,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    user-select:none;-webkit-user-select:none;
  }
  button{border:0;background:none;color:var(--fg);padding:0;cursor:pointer;font:inherit}
  button:active{opacity:.55}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}

  header{
    flex:none;display:flex;align-items:center;gap:8px;
    width:100%;max-width:560px;margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top)) 18px 8px;
    font-size:13px;color:var(--dim);
  }
  #dot{width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none;transition:background .2s}
  #dot.on{background:#34c759}
  #dot.warn{background:#ff9f0a}
  #dot.off{background:#ff453a}
  #status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ver{flex:none;font-style:normal;font-size:10px;color:var(--faint);letter-spacing:.3px}
  .icon-btn{
    flex:none;width:38px;height:38px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  #scroll{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    width:100%;max-width:560px;margin:0 auto;
    padding:2px 0 calc(24px + env(safe-area-inset-bottom));
    /* 这一行是「右滑回音乐」能不能生效的关键：不留 pan-y 的话，
       WebView 把横滑交给合成器，touchmove 根本不上报给 JS */
    touch-action:pan-y;
  }

  .ccard{
    background:var(--ccard-bg,rgba(12,12,14,.55));
    border:1px solid rgba(255,255,255,.055);
    border-radius:var(--cradius,12px);
    margin:0 var(--cmargin,8px) var(--cmargin,8px);
    padding:13px 15px 15px;
    opacity:var(--calpha,.9);
    color:var(--cvalue,#fff);
  }
  .ccard-t{font-size:13px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.78);margin-bottom:10px}
  .cgrid{display:grid;gap:10px 8px}
  .citem{min-width:0}
  .citem .k{display:block;font-size:11px;line-height:1.3;color:var(--cprop,rgba(255,255,255,.55));
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .citem .v{display:block;margin-top:3px;font-size:var(--cfs,20px);line-height:1.2;font-weight:600;
    color:var(--cvalue,#fff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .sec{display:flex;align-items:baseline;gap:8px;padding:14px 18px 8px}
  .sec h2{margin:0;font-size:15px;font-weight:600}
  .sec .hint{font-size:12px;color:var(--faint)}
  .capgrp{margin:12px 16px 6px;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.42)}
  .caps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
  .cap{
    display:flex;align-items:center;gap:8px;min-height:46px;
    padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:14px;text-align:left;line-height:1.2;
  }
  .cap:active{background:rgba(250,45,72,.28);border-color:rgba(250,45,72,.5)}
  .cap .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 风量：连续量，做成减/加两个键，比滑条在车机屏上点得准 */
  .fanrow{display:flex;align-items:center;gap:10px;margin:8px auto 0;max-width:420px;padding:8px 12px;
    border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .fanrow .fl{flex:none;width:2.6em;font-size:13px;color:var(--dim)}
  .fanrow .fv{flex:1;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  .fanrow .fb{flex:none;width:46px;height:38px;border-radius:10px;font-size:19px;line-height:1;
    background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
  .fanrow .fb:active{background:rgba(250,45,72,.3);border-color:rgba(250,45,72,.5)}
  .fanrow .fb:disabled{opacity:.3}
  .temprow{margin:8px auto 0;max-width:420px;padding:10px 12px 4px;border-radius:12px;
    background:var(--card);border:1px solid var(--line)}
  .temprow .tline{display:flex;align-items:center;gap:10px}
  .temprow .fl{flex:none;width:2.6em;font-size:13px;color:var(--dim)}
  .temprow .tv{flex:1;text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
  .temprow .fb{flex:none;width:46px;height:38px;border-radius:10px;font-size:19px;line-height:1;
    color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--line)}
  .temprow .fb:active{background:rgba(250,45,72,.3);border-color:rgba(250,45,72,.5)}
  .temprow .fb:disabled{opacity:.3}
  .temprow input[type=range]{-webkit-appearance:none;appearance:none;display:block;
    width:100%;height:28px;margin:2px 0 0;background:transparent}
  .temprow input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
    background:rgba(255,255,255,.14)}
  .temprow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    margin-top:-8px;border-radius:50%;background:#fa2d48;border:0}
  .seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;max-width:640px;margin:0 auto}
  .seatcell{padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .seatcell .sn{font-size:12px;color:var(--faint);margin-bottom:4px}
  .seatcell .sr{display:flex;align-items:center;gap:8px;padding:8px 6px;margin:0 -6px;border-radius:8px}
  .seatcell .sr+.sr{border-top:1px solid rgba(255,255,255,.06)}
  .seatcell .sr:active{background:rgba(250,45,72,.2)}
  .seatcell .sk{flex:1;font-size:13px;color:#fff}
  .seatcell .sv{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .seatcell .sv.on{color:#ff9f0a}
  .seatcell .sr.na{opacity:.35}

  .empty{margin:8px 16px 0;padding:18px 16px;background:rgba(255,255,255,.04);
    border:1px dashed var(--line);border-radius:12px;font-size:13px;line-height:1.7;color:var(--dim)}
  .empty b{color:#fff;font-weight:600}
  .log{margin:12px 16px 0;padding:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:12px;font:11px/1.6 ui-monospace,Consolas,monospace;color:rgba(255,255,255,.55);
    white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
  .hidden{display:none}
  footer{text-align:center;font-size:11px;color:var(--faint);padding:18px 12px 6px;line-height:1.7}
  footer a{color:var(--faint)}

  /* ---------- 顶部切换：车机控制 / 音乐控制 ----------
     车控在 18766、音乐在 18765，这里只能整页滑出去再跳；位置跟刷新按钮同一列，
     放在它下面，不占最顶上那行。 */
  .svc{position:relative;z-index:128;flex:none;width:100%;max-width:560px;margin:0 auto 6px;padding:0 16px}
  .svc-seg{
    position:relative;display:flex;padding:3px;
    background:rgba(26,26,32,.9);border:1px solid var(--line);
    border-radius:12px;touch-action:pan-y;
  }
  .svc-knob{
    position:absolute;top:3px;left:3px;bottom:3px;width:calc(50% - 3px);
    border-radius:9px;background:rgba(255,255,255,.14);transform:translateX(0);
  }
  .svc-btn{
    position:relative;flex:1;padding:7px 0;border:0;background:none;
    font:inherit;font-size:12.5px;color:var(--dim);
  }
  .svc-btn.on{color:#fff}
  a.svc-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;
    -webkit-tap-highlight-color:transparent}
  /* 18765 探活小圆点：绿=音乐端在跑，红=没起来（点了会撞空页，所以拦住） */
  .svc-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-left:5px;
    background:#8e8e93;vertical-align:middle;transition:background .2s}
  .svc-dot.on{background:#34c759}
  .svc-dot.off{background:#ff453a}
  .svc-seg[data-view="car"] .svc-knob{transform:translateX(0)}
  .svc-seg[data-view="music"] .svc-knob{transform:translateX(calc(100% + 6px))}
  .svc-knob{transition:transform .2s cubic-bezier(.32,.72,0,1)}

  /* 音乐控制：贴一块 iframe 在同一个页面里，不做整页跳转。
     真机上「闪一下又回原页」就是跳转被打断 —— 不跳就不会闪。
     脚本全挂时，上面那只 <a href> 还是照旧整页跳过去，兜底不丢。 */
  #musPane{position:fixed;left:0;right:0;bottom:0;z-index:120;display:none;
    background:#0b0b0d;border-top:1px solid var(--line)}
  #musPane.on{display:block}
  #musFrame{display:block;width:100%;height:100%;border:0;background:#0b0b0d}
  header,#scroll{transition:transform .26s cubic-bezier(.32,.72,0,1)}

  #toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,10px);
    max-width:80%;padding:10px 18px;border-radius:999px;
    background:rgba(28,28,30,.96);border:1px solid var(--line);
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 设置 / 诊断 ---------- */
  #setMask{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:30}
  #setMask.show{opacity:1;pointer-events:auto}
  #setSheet{
    position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;
    transform:translateY(103%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
    background:#141417;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  #setSheet.show{transform:translateY(0)}
  .set-head{flex:none;display:flex;align-items:center;gap:10px;
    padding:15px 18px 12px;border-bottom:1px solid var(--line)}
  .set-head h3{margin:0;font-size:16px;font-weight:600;flex:1}
  .set-x{width:34px;height:34px;border-radius:50%;background:var(--card);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:15px;color:var(--dim)}
  .set-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
  .set-kv{font-size:12px;line-height:1.95;color:var(--dim);margin:0 2px 12px;
    white-space:pre-wrap;word-break:break-all}
  .set-kv b{color:#fff;font-weight:600}
  .set-row{display:flex;gap:8px;margin-bottom:12px}
  .set-row button{flex:1;min-height:42px;border-radius:11px;background:var(--card);
    border:1px solid var(--line);font-size:13.5px}
  .set-row button:active{background:rgba(255,255,255,.12)}
  .set-row button.primary{background:rgba(250,45,72,.16);border-color:rgba(250,45,72,.42)}
  #segBox{margin:0;padding:12px;border-radius:12px;background:rgba(0,0,0,.38);
    border:1px solid var(--line);font:11px/1.65 ui-monospace,Consolas,monospace;
    color:rgba(255,255,255,.74);white-space:pre-wrap;word-break:break-all;
    min-height:120px;max-height:36vh;overflow:auto;user-select:text;-webkit-user-select:text}
  .set-tip{font-size:11.5px;line-height:1.75;color:var(--faint);margin:10px 2px 0}

  /* 分段切换 */
  .tabs{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}
  .tab{flex:1 0 auto;min-height:34px;padding:0 12px;border-radius:9px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    font-size:12.5px;color:var(--dim);white-space:nowrap}
  .tab.on{background:rgba(250,45,72,.18);border-color:rgba(250,45,72,.45);color:#fff}
  .tab .n{font-size:10.5px;color:var(--faint);margin-left:4px}
  .tab.on .n{color:rgba(255,255,255,.6)}

  /* 执行后数值变化闪一下 */
  .citem .v{transition:background .5s,box-shadow .5s}
  .citem.chg .v{background:rgba(52,199,89,.28);box-shadow:0 0 0 3px rgba(52,199,89,.28);
    border-radius:5px}

  @media (min-width:1000px){
    header,#scroll{max-width:1180px}
    #cards{display:grid;grid-template-columns:1fr 1fr;align-items:start}
    .caps{grid-template-columns:repeat(4,minmax(0,1fr))}
    .ccard-t{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span id="status">正在连接车机助手…</span>
  <i class="ver">b15</i>
  <button class="icon-btn" id="refresh" aria-label="刷新">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="icon-btn" id="openSet" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9.1 19a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.8 15a1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.8 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.1 4.8 1.6 1.6 0 0 0 10 3.3V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="svc">
  <div class="svc-seg" data-view="car">
    <span class="svc-knob"></span>
    <a class="svc-btn on" id="goCar" href="javascript:void 0">车机控制</a>
    <a class="svc-btn" id="goMusic" href="http://{{HOST}}:18765/">音乐控制<i class="svc-dot" id="musDot"></i></a>
  </div>
</div>
<div id="musPane"><iframe id="musFrame" title="音乐控制"></iframe></div>
<script>
  /* 地址两重保险：
     1. 服务端下发时把 {{HOST}} 换成请求里的真实主机 —— 脚本全挂也点得动；
     2. 这里再用 location.hostname 校正一次 —— 直接开网页文件时也成立。 */
  (function () {
    var h = location.hostname;
    var b = document.getElementById('goMusic');
    if (b && h) b.href = 'http://' + h + ':18765/';
    // 被音乐页拿 iframe 嵌进来时，自己这条切换栏就不要了，省得套娃
    if (location.search.indexOf('embed=1') >= 0) {
      var sv = document.querySelector('.svc');
      if (sv) sv.style.display = 'none';
    }
  })();
</script>

<div id="scroll">
  <div id="cards"></div>
  <div class="sec"><h2>温度</h2><span class="hint" id="tempHint">15 - 30 ℃ · 可拖</span></div>
  <div id="temp"></div>
  <div class="sec"><h2>控制</h2><span class="hint" id="capHint"></span></div>
  <div id="caps"></div>
  <div class="sec"><h2>座椅</h2><span class="hint">前排点一下升一档；后排按一下三档，再按关</span></div>
  <div id="seat" class="seatgrid"></div>
  <div id="log" class="log hidden"></div>
  <footer>
    数据与控制都来自车机助手（reflection），这里不发任何车机总线命令<br>
    <span id="host">—</span> · 18766
  </footer>
</div>

<div id="toast"></div>

<div id="setMask"></div>
<div id="setSheet">
  <div class="set-head">
    <h3>设置 · 诊断</h3>
    <button class="set-x" id="setClose" aria-label="关闭">✕</button>
  </div>
  <div class="set-body">
    <div class="set-kv" id="setKv">—</div>

    <div class="tabs" id="segTabs">
      <button class="tab on" data-seg="diag">诊断</button>
      <button class="tab" data-seg="log">操作记录</button>
      <button class="tab" data-seg="cards">车况</button>
      <button class="tab" data-seg="acts">动作表</button>
    </div>

    <div class="set-row">
      <button class="primary" id="segLoad">生成</button>
      <button id="segCopy">复制</button>
      <button id="segSave">下载</button>
    </div>
    <pre id="segBox">点「生成」，取当前这一段的文本。</pre>
    <div class="set-tip" id="segTip"></div>

    <div class="set-row" style="margin-top:16px">
      <button id="dumpSave">全部导出</button>
      <button id="logClear">清空记录</button>
    </div>
    <div class="set-tip">
      「全部导出」把诊断、车况、动作表、操作记录合成一个 txt，一次拿走。<br>
      「清空记录」只清操作记录，不影响服务。<br>
      下载没反应时长按上面的文本全选——App 的下载由系统管，手机浏览器里最稳。
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var POLL_MS = 2500;
  var cardsBox = document.getElementById('cards');
  var capsBox = document.getElementById('caps');
  var statusEl = document.getElementById('status');
  var dot = document.getElementById('dot');
  var logEl = document.getElementById('log');
  var hintEl = document.getElementById('capHint');
  var hostEl = document.getElementById('host');

  var busy = false;
  var inflight = false;
  var lastOp = '';          // 最近一次操作的摘要，设置面板里显示
  var lastVals = {};        // 卡片项上次的值，用来标出执行后哪里变了
  var lastChg = {};         // 变化时间戳：轮询重建 DOM 时靠它把高亮留住 4 秒

  hostEl.textContent = location.hostname;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dot.className = kind || '';
  }

  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  /** Android #AARRGGBB -> CSS rgba() */
  function argb(s) {
    if (!s) return 'rgba(255,255,255,.9)';
    var h = String(s).replace(/^#/, '');
    if (h.length === 8) {
      var a = parseInt(h.substr(0, 2), 16) / 255;
      return 'rgba(' + parseInt(h.substr(2, 2), 16) + ',' + parseInt(h.substr(4, 2), 16) + ','
        + parseInt(h.substr(6, 2), 16) + ',' + (a > 0 ? a : 1).toFixed(3) + ')';
    }
    return '#' + h;
  }

  function req(path, opt) {
    var ctl = window.AbortController ? new AbortController() : null;
    var o = { cache: 'no-store', method: (opt && opt.method) || 'GET', headers: (opt && opt.headers) || {} };
    if (ctl) o.signal = ctl.signal;
    if (opt && opt.body) o.body = opt.body;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 3500) : null;
    return fetch(path, o).then(function (r) {
      if (timer) clearTimeout(timer);
      return r.text();
    }).then(function (t) {
      return JSON.parse(t);
    }).catch(function (e) {
      if (timer) clearTimeout(timer);
      throw e;
    });
  }

  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // ---------- 卡面 ----------

  function paintStyle(st) {
    st = st || {};
    cardsBox.style.setProperty('--calpha', ((st.alpha == null ? 90 : st.alpha) / 100).toFixed(2));
    cardsBox.style.setProperty('--cradius', (st.radius || 12) + 'px');
    cardsBox.style.setProperty('--cmargin', (st.margin || 8) + 'px');
    cardsBox.style.setProperty('--cprop', argb(st.propColor));
    cardsBox.style.setProperty('--cvalue', argb(st.valueColor));
    cardsBox.style.setProperty('--cfs', (st.fontSize || 20) + 'px');
  }

  function paintCards(d) {
    cardsBox.textContent = '';
    if (!d || d.ok !== 1) {
      lastVals = {};   // 断开后重连不闪一片绿
      var e = node('div', 'empty');
      e.appendChild(node('div', null, '车机助手还没就绪'));
      e.appendChild(node('div', null, (d && d.err) ? d.err : '拿不到卡片数据'));
      cardsBox.appendChild(e);
      if (d && d.log && d.log.length) showLog(d.log);
      return;
    }
    paintStyle(d.style);
    var cards = d.cards || [];
    if (!cards.length) {
      cardsBox.appendChild(node('div', 'empty', '卡片暂无数据（车机助手可能还没生成车控卡）'));
      return;
    }
    cards.forEach(function (c) {
      var card = node('div', 'ccard');
      if (c.title) card.appendChild(node('div', 'ccard-t', c.title));
      var grid = node('div', 'cgrid');
      var cols = Math.max(1, Math.min(4, c.cols || 1));
      grid.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
      (c.items || []).forEach(function (it) {
        var cell = node('div', 'citem');
        cell.style.gridColumn = 'span ' + Math.max(1, Math.min(cols, it.s || 1));
        var val = it.v == null || it.v === '' ? '—' : String(it.v);
        var key = (c.title || c.t || '') + '|' + (it.k || '');
        var now = Date.now();
        // 上一次的值还在、这次变了：记下时间，4 秒内每次重建都标绿
        if (lastVals[key] != null && lastVals[key] !== val) {
          lastChg[key] = now;
        }
        if (lastChg[key] && now - lastChg[key] < 4000) {
          cell.className += ' chg';
        }
        lastVals[key] = val;
        cell.appendChild(node('span', 'k', it.k || ''));
        cell.appendChild(node('span', 'v', val));
        grid.appendChild(cell);
      });
      card.appendChild(grid);
      cardsBox.appendChild(card);
    });
  }

  // ---------- 控制 ----------

  // 动作表来自后端 /acts：只列车机助手里真的存在的方法，所以点下去一定有人接
  function paintActs(d) {
    capsBox.textContent = '';
    if (!d || d.ok !== 1) {
      hintEl.textContent = '';
      capsBox.appendChild(node('div', 'empty', '动作表拿不到，18766 可能没响应'));
      return;
    }
    var gs = d.groups || [];
    var total = 0;
    gs.forEach(function (g) {
      var items = g.items || [];
      if (!items.length) return;
      total += items.length;
      capsBox.appendChild(node('div', 'capgrp', g.g));
      var grid = node('div', 'caps');
      items.forEach(function (it) {
        var b = node('button', 'cap');
        b.appendChild(node('span', 'nm', it.t || it.id));
        b.addEventListener('click', function () { act(it.id, it.t || it.id, it.v); });
        grid.appendChild(b);
      });
      capsBox.appendChild(grid);
      if (g.g === '空调') {
        // 风量跟空调一组，就贴在 AUTO / 内外循环 下面
        capsBox.appendChild(fanBox('f', '前排'));
        capsBox.appendChild(fanBox('r', '后排'));
        fanShow();
      }
    });
    hintEl.textContent = total ? (total + ' 项') : '';
    if (!total) {
      capsBox.appendChild(node('div', 'empty',
        '助手未绑定：先在车机上打开一次「桌面助手」，再回来刷新'));
    }
  }

  // ---------- 风量 ----------
  // 车机助手里风量是滑条不是按钮，动作表按方法名筛不出来，所以单独走 /fan

  var fanF = -1;      // 前排档位，-1 = 还没读到
  var fanR = -1;      // 后排档位，0 = 关
  var fanBusy = false;

  function fanBox(kind, label) {
    var row = node('div', 'fanrow');
    row.dataset.kind = kind;
    row.appendChild(node('span', 'fl', label));
    var minus = node('button', 'fb', '−');
    var val = node('span', 'fv', '—');
    var plus = node('button', 'fb', '＋');
    minus.addEventListener('click', function () { fanStep(kind, -1); });
    plus.addEventListener('click', function () { fanStep(kind, 1); });
    row.appendChild(minus);
    row.appendChild(val);
    row.appendChild(plus);
    return row;
  }

  function fanShow() {
    var rows = capsBox.querySelectorAll('.fanrow');
    for (var i = 0; i < rows.length; i++) {
      var f = rows[i].dataset.kind === 'f';
      var v = f ? fanF : fanR;
      rows[i].querySelector('.fv').textContent =
        v < 0 ? '—' : (!f && v === 0 ? '关' : v);
      var bs = rows[i].querySelectorAll('.fb');
      // 读到确定档位才按边界灰化：后排刚关掉、状态还没回来时锁死加号，
      // 会变成「关了再也开不起来」。
      bs[0].disabled = v >= 0 && v <= (f ? 1 : 0);
      bs[1].disabled = v >= 0 && v >= (f ? 7 : 4);
    }
  }

  function fanStep(kind, d) {
    if (fanBusy) return;
    var f = kind === 'f';
    var cur = f ? fanF : fanR;
    if (cur < 0) cur = f ? 2 : 0;
    var next = f ? Math.max(1, Math.min(7, cur + d)) : Math.max(0, Math.min(4, cur + d));
    if (next === cur) return;
    fanBusy = true;
    var body = {};
    body[f ? 'v' : 'r'] = next;
    req('/fan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      fanBusy = false;
      if (r && r.ok === 1) {
        // 先按点的值显示，总线回读有延迟，600ms 后再校准一次
        if (f) fanF = next; else fanR = next;
        fanShow();
        setStatus('风量 ' + (f ? '前排 ' : '后排 ') + (next === 0 ? '关' : next), 'on');
        delete segCache.log;
        setTimeout(loadFan, 600);
        setTimeout(loadCards, 600);
      } else {
        toast((r && r.err) ? r.err : '风量没设上');
        setStatus((r && r.err) ? r.err : '风量设置失败', 'warn');
      }
    }).catch(function () {
      fanBusy = false;
      toast('连不上桥接服务');
      setStatus('请求失败', 'off');
    });
  }

  function loadFan() {
    req('/fan').then(function (r) {
      if (!r || r.ok !== 1) return;
      if (r.front >= 0) fanF = r.front;
      if (r.rear >= 0) fanR = r.rear;
      fanShow();
    }).catch(function () {});
  }

  // ---------- 温度 ----------
  var tempV = -1;
  var tempBusy = false;
  var TEMP_MIN = 15;
  var TEMP_MAX = 30;

  function tempBuild() {
    var box = document.getElementById('temp');
    if (!box || box.dataset.built) return;
    box.dataset.built = '1';
    var row = node('div', 'temprow');
    var top = node('div', 'tline');
    top.appendChild(node('span', 'fl', '主驾'));
    var minus = node('button', 'fb', '−');
    var val = node('span', 'tv', '—');
    var plus = node('button', 'fb', '＋');
    top.appendChild(minus);
    top.appendChild(val);
    top.appendChild(plus);
    var bar = document.createElement('input');
    bar.type = 'range';
    bar.min = String(TEMP_MIN);
    bar.max = String(TEMP_MAX);
    bar.step = '1';
    bar.value = '24';
    minus.addEventListener('click', function () { tempStep(-1); });
    plus.addEventListener('click', function () { tempStep(1); });
    bar.addEventListener('input', function () { val.textContent = bar.value + '°C'; });
    bar.addEventListener('change', function () { tempSet(parseInt(bar.value, 10)); });
    row.appendChild(top);
    row.appendChild(bar);
    box.appendChild(row);
    box._el = { minus: minus, plus: plus, val: val, bar: bar };
  }

  function tempShow() {
    var box = document.getElementById('temp');
    if (!box || !box._el) return;
    var v = tempV;
    box._el.val.textContent = v < 0 ? '—' : v + '°C';
    if (v >= 0) box._el.bar.value = String(v);
    box._el.minus.disabled = v >= 0 && v <= TEMP_MIN;
    box._el.plus.disabled = v >= 0 && v >= TEMP_MAX;
  }

  function tempStep(d) {
    var cur = tempV < 0 ? 24 : tempV;
    tempSet(Math.max(TEMP_MIN, Math.min(TEMP_MAX, cur + d)));
  }

  function tempSet(v) {
    if (tempBusy) return;
    var t = Math.max(TEMP_MIN, Math.min(TEMP_MAX, v));
    tempBusy = true;
    req('/temp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ v: t })
    }).then(function (r) {
      tempBusy = false;
      if (r && r.ok === 1) {
        tempV = r.v >= 0 ? r.v : t;
        tempShow();
        setStatus('温度 ' + tempV + '°C', 'on');
        setTimeout(loadTemp, 800);
      } else {
        toast((r && r.err) ? r.err : '温度没设上');
        setStatus((r && r.err) ? r.err : '温度设置失败', 'warn');
        loadTemp();
      }
    }).catch(function () {
      tempBusy = false;
      toast('连不上桥接服务');
      setStatus('请求失败', 'off');
    });
  }

  function loadTemp() {
    req('/temp').then(function (r) {
      if (!r || r.ok !== 1) return;
      if (r.v >= 0) tempV = r.v;
      tempShow();
    }).catch(function () {});
  }

  /** 温度回读兜底：/temp 拿不到时，用卡片里「主驾温度」那一项把数字填上 */
  function tempFromCards(d) {
    if (tempV >= 0) return;
    var cards = (d && d.cards) || [];
    for (var i = 0; i < cards.length; i++) {
      var items = cards[i].items || [];
      for (var j = 0; j < items.length; j++) {
        var k = items[j].k || '';
        if (k.indexOf('温度') < 0 || k.indexOf('驾') < 0) continue;
        var n = parseFloat(String(items[j].v).replace(/[^0-9.]/g, ''));
        if (n >= 10 && n <= 40) {
          tempV = Math.round(n);
          tempShow();
          return;
        }
      }
    }
  }

  // ---------- 座椅 ----------
  // 后排只有加热（车机助手里没有后排通风的命令，也没有状态位），
  // 所以后排一格只画「加热」：按一下 3 档，再按一下关。
  // 前排加热 / 通风是 关 → 1 → 2 → 3 → 关。
  var seatState = {};
  var seatBusy = false;
  var SEAT_POS = [['fl', '左前', 1], ['fr', '右前', 1], ['rl', '左后', 0], ['rr', '右后', 0]];

  function seatBuild() {
    var box = document.getElementById('seat');
    if (!box || box.dataset.built) return;
    box.dataset.built = '1';
    SEAT_POS.forEach(function (p) {
      var cell = node('div', 'seatcell');
      cell.appendChild(node('div', 'sn', p[1]));
      var kinds = [['heat', '加热']];
      if (p[2]) kinds.push(['vent', '通风']);
      kinds.forEach(function (k) {
        var r = node('div', 'sr');
        r.dataset.pos = p[0];
        r.dataset.kind = k[0];
        r.appendChild(node('span', 'sk', k[1]));
        r.appendChild(node('span', 'sv', '—'));
        r.addEventListener('click', function () { seatTap(p[0], k[0], p[2]); });
        cell.appendChild(r);
      });
      box.appendChild(cell);
    });
  }

  function seatLevel(pos, kind) {
    var raw = seatState[kind + '_' + pos];
    if (!raw) return -1;
    if (String(raw).indexOf('关') >= 0) return 0;
    var m = String(raw).match(/(\d+)/);
    return m ? parseInt(m[1], 10) : -1;
  }

  function seatText(lv) {
    return lv <= 0 ? '关' : (lv + ' 档');
  }

  function seatShow() {
    var rows = document.querySelectorAll('#seat .sr');
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var lv = seatLevel(r.dataset.pos, r.dataset.kind);
      var sv = r.querySelector('.sv');
      sv.textContent = lv < 0 ? '—' : seatText(lv);
      sv.className = 'sv' + (lv > 0 ? ' on' : '');
      r.className = 'sr' + (lv < 0 ? ' na' : '');
    }
  }

  function seatTap(pos, kind, ventOk) {
    if (seatBusy) return;
    var cur = seatLevel(pos, kind);
    var next;
    if (kind === 'heat' && !ventOk) {
      next = cur > 0 ? 0 : 3;                 // 后排：开就三档
    } else {
      next = cur < 0 ? 1 : (cur >= 3 ? 0 : cur + 1);
    }
    seatBusy = true;
    req('/seat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p: pos, k: kind, lv: next })
    }).then(function (r) {
      seatBusy = false;
      if (r && r.ok === 1) {
        // 先按预期画上，车机回读有延迟，1.2s / 2.6s 再各对一次
        seatState[kind + '_' + pos] = seatText(next);
        seatShow();
        setTimeout(loadSeat, 1200);
        setTimeout(loadSeat, 2600);
      } else {
        toast((r && r.err) ? r.err : '座椅没响应');
        setStatus((r && r.err) ? r.err : '座椅设置失败', 'warn');
        loadSeat();
      }
    }).catch(function () {
      seatBusy = false;
      toast('连不上桥接服务');
      setStatus('请求失败', 'off');
    });
  }

  function loadSeat() {
    req('/seat').then(function (r) {
      if (!r || r.ok !== 1 || !r.seats) return;
      seatState = r.seats;
      seatShow();
    }).catch(function () {});
  }

  function act(id, name, v) {
    if (busy) return;
    busy = true;
    setStatus('执行：' + name, 'warn');
    var t0 = Date.now();
    req('/act', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ a: id, v: (v == null ? -1 : v) })
    }).then(function (r) {
      busy = false;
      var ms = Date.now() - t0;
      if (r && r.ok === 1) {
        lastOp = name + ' · 成功 · ' + ms + 'ms';
        toast(name + ' 已执行');
        setStatus('已执行：' + name, 'on');
      } else {
        lastOp = name + ' · 失败' + (r && r.err ? '：' + r.err : '') + ' · ' + ms + 'ms';
        toast(name + ' 没执行成功');
        setStatus((r && r.err) ? r.err : '执行失败', 'warn');
        if (r && r.err) showLog([r.err]);
      }
      delete segCache.log;      // 记录变了，下次进「操作记录」重新取
      setTimeout(loadCards, 600);
    }).catch(function () {
      busy = false;
      lastOp = name + ' · 请求失败';
      toast('连不上桥接服务');
      setStatus('请求失败', 'off');
    });
  }

  function showLog(lines) {
    if (!lines || !lines.length) return;
    logEl.classList.remove('hidden');
    logEl.textContent = lines.slice(-8).join('\n');
  }

  // ---------- 数据 ----------

  function loadCards() {
    if (inflight) return;
    inflight = true;
    req('/cards').then(function (d) {
      inflight = false;
      paintCards(d);
      tempFromCards(d);
      setStatus(d && d.ok === 1 ? '已连接 · 车机助手' : '车机助手未就绪', d && d.ok === 1 ? 'on' : 'warn');
      if (d && d.log) showLog(d.log);
    }).catch(function () {
      inflight = false;
      paintCards({ ok: 0, err: '请求超时' });
      setStatus('连不上车机助手', 'off');
    });
  }

  function loadActs() {
    req('/acts').then(function (d) {
      paintActs(d);
    }).catch(function () { paintActs(null); });
  }

  function refreshAll() {
    tempBuild();
    seatBuild();
    loadCards();
    loadActs();
    loadFan();
    loadTemp();
    loadSeat();
  }

  // ---------- 设置 / 导出 ----------

  var mask = document.getElementById('setMask');
  var sheet = document.getElementById('setSheet');
  var kvEl = document.getElementById('setKv');
  var segBox = document.getElementById('segBox');
  var segTip = document.getElementById('segTip');
  var tabsEl = document.getElementById('segTabs');

  // 四段文本用的是同一套「生成 → 复制 → 下载」，只是取的地址不同
  var SEGS = {
    diag: {
      url: '/diag', file: '车机诊断', slow: 18000,
      tip: '端口、引擎绑定、安装包版本、动作项数、进程日志和 logcat 摘要。'
    },
    log: {
      url: '/acts.log', file: '操作记录', slow: 6000,
      tip: '每次点按钮的结果和耗时，最新的在最上面。「点了没反应」先看这里。'
    },
    cards: {
      url: '/cards.txt', file: '车况快照', slow: 6000,
      tip: '每张卡、每一项的名字和值。某张卡少了什么，发这段比截图清楚。'
    },
    acts: {
      url: '/acts.txt', file: '动作表', slow: 6000,
      tip: '当前能执行的项和方法名。表里有、方法不存在的会标出来。'
    }
  };

  var curSeg = 'diag';
  var segCache = {};        // 分段 -> 文本，切来切去不重复请求
  var segBusy = false;

  function openSet() {
    sheet.classList.add('show');
    mask.classList.add('show');
    loadPing();
    pickSeg(curSeg);    // 里面对空缓存会自动取一次，省一次点击
  }

  function closeSet() {
    sheet.classList.remove('show');
    mask.classList.remove('show');
  }

  function loadPing() {
    kvEl.textContent = '读取中…';
    req('/ping').then(function (d) {
      if (!d || d.ok !== 1) {
        kvEl.textContent = '18766 没响应';
        return;
      }
      kvEl.textContent = '地址　' + location.origin + '\n'
        + '服务　端口 ' + d.port + (d.bound ? ' 已绑定' : ' 未绑定') + ' · 接口 v' + d.v + '\n'
        + '引擎　' + (d.helper ? '已绑定' : '未绑定 ← 车机上打开一次桌面助手')
        + ' · 界面 ' + (d.activity ? '已出现' : '未出现') + '\n'
        + '操作　' + (d.ops == null ? 0 : d.ops) + ' 次调用'
        + (d.opsFail ? ' · 失败 ' + d.opsFail : '')
        + (lastOp ? '\n最近　' + lastOp : '')
        + (d.err ? '\n错误　' + d.err : '');
    }).catch(function () {
      kvEl.textContent = '连不上 18766，诊断也取不到。先确认车机助手在跑。';
    });
  }

  function pickSeg(seg) {
    if (!SEGS[seg]) return;
    curSeg = seg;
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-seg') === seg);
    });
    segTip.textContent = SEGS[seg].tip;
    segBox.textContent = segCache[seg] || ('点「生成」取' + SEGS[seg].file + '。');
    segBox.scrollTop = 0;
    if (!segCache[seg] && !segBusy) loadSeg();   // 切过去就取，不用再点一次
  }

  /** 诊断要等服务端跑 logcat，普通 req() 那 3.5 秒不够，所以每段自带超时 */
  function loadSeg() {
    if (segBusy) return;      // 连点会堆请求
    var seg = curSeg;
    var cfg = SEGS[seg];
    segBusy = true;
    segBox.textContent = '读取中…';
    var ctl = window.AbortController ? new AbortController() : null;
    var o = { cache: 'no-store' };
    var timer = null;
    if (ctl) {
      o.signal = ctl.signal;
      timer = setTimeout(function () { ctl.abort(); }, cfg.slow);
    }
    fetch(cfg.url, o).then(function (r) {
      if (timer) clearTimeout(timer);
      return r.text();
    }).then(function (t) {
      segBusy = false;
      segCache[seg] = t;
      if (curSeg === seg) {
        segBox.textContent = t;
        segBox.scrollTop = 0;
      }
    }).catch(function () {
      if (timer) clearTimeout(timer);
      segBusy = false;
      if (curSeg === seg) {
        segBox.textContent = '取不到：18766 没响应。\n'
          + '可以直接在浏览器里打开 ' + location.origin + cfg.url + ' 看看。';
      }
    });
  }

  function copySeg() {
    var t = segCache[curSeg];
    if (!t) {
      toast('先点「生成」');
      return;
    }
    copyText(t);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('已复制');
      }, function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  /** http 局域网地址不是安全上下文，clipboard API 常常没有，退回 textarea */
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    toast(ok ? '已复制' : '复制被拦，长按上面的文本全选');
  }

  function stamp() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
      + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function saveText(text, name) {
    try {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1500);
      toast('已保存 ' + name);
    } catch (e) {
      toast('下载不支持，长按上面的文本手动复制');
    }
  }

  function saveSeg() {
    var t = segCache[curSeg];
    if (!t) {
      toast('先点「生成」');
      return;
    }
    var cfg = SEGS[curSeg];
    saveText(t, cfg.file + '_' + stamp() + '.txt');
  }

  /** 全部导出：服务端拼好一整份，这里只负责存下来 */
  function saveDump() {
    toast('正在打包…');
    var ctl = window.AbortController ? new AbortController() : null;
    var o = { cache: 'no-store' };
    var timer = null;
    if (ctl) {
      o.signal = ctl.signal;
      timer = setTimeout(function () { ctl.abort(); }, 25000);
    }
    fetch('/dump', o).then(function (r) {
      if (timer) clearTimeout(timer);
      return r.text();
    }).then(function (t) {
      saveText(t, '车机全量_' + stamp() + '.txt');
    }).catch(function () {
      if (timer) clearTimeout(timer);
      toast('打包失败，先试试单个「下载」');
    });
  }

  function clearLog() {
    req('/log/clear').then(function (r) {
      if (r && r.ok === 1) {
        delete segCache.log;
        if (curSeg === 'log') segBox.textContent = '点「生成」取操作记录。';
        toast('操作记录已清空');
      } else {
        toast('清空失败');
      }
    }).catch(function () { toast('连不上桥接服务'); });
  }

  document.getElementById('openSet').addEventListener('click', openSet);
  document.getElementById('setClose').addEventListener('click', closeSet);
  mask.addEventListener('click', closeSet);
  tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.tab') : null;
    if (b) pickSeg(b.getAttribute('data-seg'));
  });
  document.getElementById('segLoad').addEventListener('click', loadSeg);
  document.getElementById('segCopy').addEventListener('click', copySeg);
  document.getElementById('segSave').addEventListener('click', saveSeg);
  document.getElementById('dumpSave').addEventListener('click', saveDump);
  document.getElementById('logClear').addEventListener('click', clearLog);
  segTip.textContent = SEGS.diag.tip;

  document.getElementById('refresh').addEventListener('click', function () {
    refreshAll();
    toast('已刷新');
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadCards();
  });

  /* 顶部两个按钮是 <a href>，地址在上面那段小脚本里设好，这里不绑跳转。
     只多做一件事：盯着 18765 通不通，红了就别让人点进去撞空页。 */
  var musDot = document.getElementById('musDot');
  var musGo = document.getElementById('goMusic');
  var musOk = null;

  function paintMusDot() {
    if (!musDot) return;
    musDot.className = 'svc-dot' + (musOk === true ? ' on' : (musOk === false ? ' off' : ''));
  }

  function probeMusic() {
    var h = location.hostname || '127.0.0.1';
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      musOk = false;
      paintMusDot();
    }, 2200);
    fetch('http://' + h + ':18765/ping?t=' + (new Date().getTime()),
          { mode: 'no-cors', cache: 'no-store' })
      .then(function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        musOk = true;
        paintMusDot();
      })
      .catch(function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        musOk = false;
        paintMusDot();
      });
  }

  /* 切页：不跳转，直接把 18765 的页面嵌进来（同一个屏幕里换内容）。 */
  var musPane = document.getElementById('musPane');
  var musFrame = document.getElementById('musFrame');
  var carTab = document.getElementById('goCar');
  var segBar = document.querySelector('.svc-seg');

  function paneTop() {
    if (!musPane || !segBar) return;
    var r = segBar.getBoundingClientRect();
    musPane.style.top = Math.max(0, Math.round(r.bottom + 6)) + 'px';
  }

  function showMusic() {
    if (!musPane || !musFrame) return false;
    var h = location.hostname || '127.0.0.1';
    var src = 'http://' + h + ':18765/?embed=1';
    if (musFrame.getAttribute('src') !== src) musFrame.setAttribute('src', src);
    paneTop();
    musPane.className = 'on';
    if (segBar) segBar.setAttribute('data-view', 'music');
    if (musGo) musGo.className = 'svc-btn on';
    if (carTab) carTab.className = 'svc-btn';
    return true;
  }

  function showCar() {
    if (!musPane) return false;
    musPane.className = '';
    if (segBar) segBar.setAttribute('data-view', 'car');
    if (musGo) musGo.className = 'svc-btn';
    if (carTab) carTab.className = 'svc-btn on';
    return true;
  }

  if (musGo) {
    musGo.addEventListener('click', function (e) {
      if (musOk === false) {
        e.preventDefault();
        toast('音乐端 18765 没响应：到车机上打开一次汽水音乐再切');
        return;
      }
      if (showMusic()) e.preventDefault();   // 嵌进来了就不用跳
    });
  }
  if (carTab) {
    carTab.addEventListener('click', function (e) {
      if (musPane && musPane.className.indexOf('on') >= 0) {
        e.preventDefault();
        showCar();
      }
    });
  }
  window.addEventListener('resize', paneTop);

  refreshAll();
  setInterval(function () { if (!document.hidden) loadCards(); }, POLL_MS);

  // 探活放最后：老 WebView 上没有 fetch 也只是圆点不亮，别把整页脚本带崩
  try {
    probeMusic();
    setInterval(probeMusic, 8000);
  } catch (err) { }
})();
</script>
</body>
</html>
