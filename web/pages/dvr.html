<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>行车记录仪</title>
<style>
  :root{
    --fg:#fff;--dim:rgba(255,255,255,.6);--faint:rgba(255,255,255,.34);
    --line:rgba(255,255,255,.12);--card:rgba(255,255,255,.06);--red:#fa2d48;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%;background:#0b0b0d;color:var(--fg);
    font:14px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  body{max-width:620px;margin:0 auto;padding:0 0 32px}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:rgba(11,11,13,.94);border-bottom:1px solid var(--line)}
  .back{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:22px;line-height:1}
  .back:active{background:rgba(250,45,72,.28)}
  .ttl{flex:1;font-size:16px;font-weight:600}
  .ip{font-size:11px;color:var(--faint);font-family:ui-monospace,Consolas,monospace}
  .bar{display:flex;gap:8px;padding:12px 16px 0}
  .btn{flex:1;height:42px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:13.5px}
  .btn:active{background:rgba(250,45,72,.28);border-color:rgba(250,45,72,.5)}
  .btn.primary{background:rgba(250,45,72,.2);border-color:rgba(250,45,72,.45)}
  .st{padding:9px 18px 0;font-size:12px;color:var(--faint);min-height:16px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec{display:flex;align-items:baseline;gap:8px;padding:16px 18px 6px}
  .sec h2{margin:0;font-size:15px;font-weight:600;flex:none}
  .sec .dir{flex:1;min-width:0;font-size:11px;color:var(--faint);
    font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;cursor:pointer}
  .sec .cnt{flex:none;font-size:12px;color:var(--dim)}
  .list{padding:0 10px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 8px;width:100%;
    border:0;background:none;color:var(--fg);text-align:left;border-radius:10px}
  .row+.row{border-top:1px solid rgba(255,255,255,.07)}
  .row:active{background:rgba(255,255,255,.05)}
  .li{flex:1;min-width:0;display:block}
  .t{display:block;font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .f{display:block;margin-top:2px;font-size:11.5px;color:var(--faint);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .dl{flex:none;border:0;background:none;color:var(--faint);font-size:12px;
    padding:6px 2px;font-family:inherit;cursor:pointer}
  .fold .ic{flex:none;width:18px;text-align:center;font-size:13px;color:#f0b429}
  .nav{padding:0 18px 4px}
  .up{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--dim);font-size:12px}
  .up:active{background:rgba(250,45,72,.3);color:#fff}
  .more{margin:6px 18px 0;width:calc(100% - 36px);height:38px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);font-size:13px}
  .more:active{background:rgba(250,45,72,.25);color:#fff}
  .empty{margin:8px 16px 0;padding:16px 14px;border:1px dashed var(--line);border-radius:12px;
    color:var(--dim);font-size:13px;line-height:1.7;text-align:center}
  .empty .raw{display:block;margin-top:6px;font-size:10.5px;color:var(--faint);
    font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .empty .row2{display:flex;gap:8px;justify-content:center;margin-top:10px}
  .empty .row2 button{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--dim);font-size:12px;font-family:inherit}
  .empty .row2 button:active{background:rgba(250,45,72,.25);color:#fff}
  .empty .rep{text-align:left;margin-top:8px;font-size:12px;line-height:1.9;
    font-family:ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap;
    word-break:break-all}
  .empty .rep b{color:#fff;font-weight:600}
  .fsbox{margin:8px 12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .fsbox iframe{display:block;width:100%;height:52vh;border:0;background:#0b0b0d}
  .hint{padding:8px 18px 0;font-size:11px;color:var(--faint)}
  #toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
    background:rgba(0,0,0,.86);border:1px solid var(--line);color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:40}
  /* 录像预览浮层：直接把 /dvr/file 喂给 video，不走新接口 */
  .pv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.96);
    display:none;flex-direction:column}
  .pv.on{display:flex}
  .pv .nm{padding:calc(10px + env(safe-area-inset-top)) 14px 0;font-size:12px;color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
  .pv .pvtip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.66);color:#fff;
    font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .15s}
  .pv .pvtip.on{opacity:1}
  .pv .bar2{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  .pv .bar2 .btn{height:42px}
  #toast.on{opacity:1}
</style>
<script>
/* 被统一外壳用 iframe 嵌入时（?pane=dvr）收掉自己的顶栏，否则两层头。
   独立打开（不带 pane）行为完全不变。 */
if (/[?&]pane=dvr(&|$)/.test(location.search)) {
  document.documentElement.className += ' pane';
}
</script>
<style>
html.pane .top{display:none}
</style>
</head>
<body>

<div class="top">
  <button class="back" id="back" aria-label="返回">‹</button>
  <div class="ttl">行车记录仪</div>
  <div class="ip" id="ip">—</div>
</div>

<div class="bar">
  <button class="btn primary" id="connect">连接</button>
  <button class="btn" id="disconnect">断开</button>
  <button class="btn" id="copypath">复制当前路径</button>
</div>
<div class="st" id="st">未连接</div>

<div id="root"><div class="empty">点「连接」读取记录仪录像。</div></div>
<div id="toast"></div>

<div class="pv" id="pv">
  <div class="nm" id="pvName"></div>
  <video id="pvVideo" controls playsinline></video>
  <div class="pvtip" id="pvTip"></div>
  <div class="bar2">
    <button class="btn" id="pvClose">关闭</button>
    <button class="btn primary" id="pvDl">下载</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  function el(id) { return document.getElementById(id); }
  var root = el('root'), st = el('st');
  var curIp = '';
  var curPath = '';                               // 当前浏览的目录，供「复制当前路径」用
  var seq = 0;                                    // 连接序号：断开后旧请求的结果直接丢
  var direct = false;                             // 手机能直连记录仪 80 端口时，文件不走车机中转

  var TITLE = { normal: '普通录像', event: '事件录像' };
  var DEF = { normal: '/SD0/NOR/M_video/', event: '/SD0/EVT/M_video/' };
  var opened = { normal: false, event: false };    // 「更多」是否展开
  var state = { normal: null, event: null };       // 最近一次返回：展开/收起时本地重绘，不重发请求
  var FAILBTNS = '<div class="row2"><button data-diag="1">诊断</button>' +
    '<button data-fixip="1">指定 IP</button></div>';

  /* 列表本地缓存：同一目录再打开先摆上次结果，再后台刷新。
     记录仪慢的时候至少不是白屏转圈。 */
  function memoRead(p) {
    try {
      var raw = localStorage.getItem('dvr.list.' + p);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.d || !o.d.ok) return null;
      o.d.stale = 1;
      return o.d;
    } catch (e) { return null; }
  }
  function memoWrite(p, d) {
    try {
      if (!d || !d.ok) return;
      localStorage.setItem('dvr.list.' + p, JSON.stringify({ t: Date.now(), d: d }));
    } catch (e) {}
  }

  function toast(t) {
    var e = el('toast');
    e.textContent = t; e.className = 'on';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { e.className = ''; }, 1500);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function setStatus(t) { st.textContent = t; }

  /* 把「连上了 / 断开了」报给外壳，外壳只靠这条消息点亮状态点，
     自己绝不去探 18767 —— 用户点了断开之后就该一直是断开。 */
  function notify(on, d) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ src: 'dvr', connected: !!on, direct: !!d }, '*');
      }
    } catch (e) {}
  }

  /* 探测手机能不能直接到记录仪的 80 端口：能就走直连，少穿一层车机 WiFi。
     no-cors 只关心请求有没有完成，读不到内容没关系；1.6 秒不通就算中转。 */
  function probeDirect(ip) {
    return new Promise(function (res) {
      if (!ip) { res(false); return; }
      var done = false;
      var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
      var t = setTimeout(function () {
        if (done) return;
        done = true;
        if (ctrl) { try { ctrl.abort(); } catch (e) {} }
        res(false);
      }, 1600);
      var opt = { mode: 'no-cors', cache: 'no-store' };
      if (ctrl) opt.signal = ctrl.signal;
      fetch('http://' + ip + '/?_=' + Date.now(), opt).then(function () {
        if (!done) { done = true; clearTimeout(t); res(true); }
      }, function () {
        if (!done) { done = true; clearTimeout(t); res(false); }
      });
    });
  }

  function fmtSize(s) {
    var v = parseInt(s, 10);
    if (!isFinite(v) || v <= 0) return '';
    if (v >= 1073741824) return (Math.round(v / 10737418.24) / 100) + ' GB';
    return (Math.round(v / 104857.6) / 10) + ' MB';
  }

  /* 后端单边可能要等记录仪 9 秒×2 协议，前端必须自带超时，
     否则弱设备不应答时页面会一直转，看不到「重试/失败」。 */
  function api(p, ms) {
    var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms || 26000) : null;
    var opt = { cache: 'no-store' };
    if (ctrl) opt.signal = ctrl.signal;
    return fetch(p, opt).then(
      function (r) { if (timer) clearTimeout(timer); return r.json(); },
      function (e) {
        if (timer) clearTimeout(timer);
        throw new Error((e && e.name === 'AbortError') ? '读取超时' : ((e && e.message) || e));
      }
    );
  }

  /* 文件地址：手机能直连记录仪就直接请求它自己的路径（记录仪没有 /dvr/file 这个接口），
     否则走车机代理 /dvr/file。 */
  function encodePath(p) {
    return String(p || '').split('/').map(encodeURIComponent).join('/');
  }
  function fileUrl(p, dl) {
    if (direct && curIp) return 'http://' + curIp + encodePath(p);
    return '/dvr/file?p=' + encodeURIComponent(p) + (dl ? '&dl=1' : '');
  }

  /* 原生下载：安卓 DownloadManager / iOS 系统下载。WebView 自己不会存盘，
     a[download] 在壳里点了没反应就是这么来的。 */
  function nativeDownload(url, name) {
    try {
      var abs = new URL(url, location.href).href;
      var N = window.CarRemoteNative;
      if (N && typeof N.download === 'function') {
        N.download(abs, name);
        return true;
      }
      var ios = window.webkit && window.webkit.messageHandlers
        && window.webkit.messageHandlers.carRemote;
      if (ios) {
        ios.postMessage({ action: 'download', url: abs, name: name });
        return true;
      }
    } catch (e) {}
    return false;
  }

  /* 下载：原生优先（可以用直连地址，快）；没有原生通道就用车机代理带 dl=1，
     让浏览器拿到 Content-Disposition 真正存盘，而不是把视频打开播放。 */
  function download(dir, f) {
    if (nativeDownload(fileUrl(dir + f, true), f)) {
      toast('已开始下载 ' + f);
      return;
    }
    var a = document.createElement('a');
    a.href = '/dvr/file?p=' + encodeURIComponent(dir + f) + '&dl=1';
    a.download = f;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('开始下载 ' + f);
  }

  /* 预览：同一条 /dvr/file，只是不带 dl=1，后端就回内联视频流。
     能直连就直接读记录仪；不能就走车机（车机会顺手缓存，第二次起本地出）。 */
  var pvDir = '', pvName = '', pvRetried = false;
  /* 提示只在「真的没画面可看」时出。
     画面已经在动、缓冲也够（readyState>=3），任何「缓冲中/缓冲 42%」都收掉 ——
     一边播一边压着缓存提示，看着就是自相矛盾。 */
  function pvTip(t) {
    var e = el('pvTip');
    var v = el('pvVideo');
    if (t && v && !v.paused && v.readyState >= 3) t = '';
    e.textContent = t || '';
    e.className = 'pvtip' + (t ? ' on' : '');
  }
  function preview(dir, f) {
    pvDir = dir; pvName = f;
    pvRetried = false;
    el('pvName').textContent = f + (direct ? ' · 直连' : ' · 中转');
    var v = el('pvVideo');
    pvTip('缓冲中…');
    v.onwaiting = function () { pvTip('缓冲中…'); };
    v.onstalled = function () { pvTip('网络慢，正在续…'); };
    v.onplaying = function () { pvTip(''); };
    v.oncanplay = function () { pvTip(''); };
    v.onprogress = function () {
      try {
        if (v.buffered.length && v.duration) {
          var pct = Math.round(v.buffered.end(v.buffered.length - 1) / v.duration * 100);
          if (pct < 99) pvTip('缓冲 ' + pct + '%');
          else pvTip('');
        }
      } catch (e) {}
    };
    v.onerror = function () {
      /* 直连探测只试了根路径，文件路径万一不通就自动退回车机中转，别让用户卡死 */
      if (direct && !pvRetried) {
        pvRetried = true;
        pvTip('直连失败，改走车机中转…');
        v.src = '/dvr/file?p=' + encodeURIComponent(dir + f);
        var p2 = v.play();
        if (p2 && p2.catch) p2.catch(function () {});
        return;
      }
      pvTip('这个格式播不了，点「下载」用播放器看');
    };
    v.src = fileUrl(dir + f, false);
    el('pv').className = 'pv on';
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  }
  function closePv() {
    var v = el('pvVideo');
    v.onerror = null;
    v.onwaiting = null;
    v.onstalled = null;
    v.onplaying = null;
    v.oncanplay = null;
    v.onprogress = null;
    try { v.pause(); } catch (e) {}
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    pvTip('');
    el('pv').className = 'pv';
  }
  el('pvClose').addEventListener('click', closePv);
  el('pvDl').addEventListener('click', function () {
    if (pvName) download(pvDir, pvName);
  });

  /* 解析不出列表时，把记录仪自己的目录页代理进来 */
  function frame(dir) {
    if (!dir) return '';
    return '<div class="hint">↓ 记录仪自己的文件列表（原样转出来的）</div>' +
      '<div class="fsbox"><iframe src="/dvr/fs?p=' + encodeURIComponent(dir) +
      '" loading="lazy"></iframe></div>';
  }

  /* 一段：标题 + 目录 + 文件夹 + 文件（默认只给最新 5 个） */
  function paint(type) {
    var sec = el('sec-' + type);
    if (!sec) return;
    var d = state[type];
    var dir = (d && d.path) || DEF[type];
    var list = (d && d.list) || [];
    var dirs = (d && d.dirs) || [];
    var total = list.length;

    var h = '<div class="sec"><h2>' + TITLE[type] + '</h2>' +
      '<span class="dir" data-path="' + esc(dir) + '">' + esc(dir) + '</span>' +
      '<span class="cnt">' + (d && d.ok
        ? (total + dirs.length) + ' 项' + (d.stale ? '（上次结果）' : '')
        : '没读到') + '</span></div>';

    if (!d) { sec.innerHTML = h + '<div class="empty">读取中…</div>'; return; }

    if (!d.ok) {
      sec.innerHTML = h + '<div class="empty">' + esc(d.err || '读取失败') +
        (d.stat ? '<span class="raw">' + esc(d.stat) + '</span>' : '') +
        FAILBTNS + '</div>' + frame(dir);
      sec.dataset.dir = dir;
      return;
    }

    if (d && d.ok && dir !== DEF[type]) {
      h += '<div class="nav"><button class="up" data-go="' + esc(d.parent || '/') +
        '">‹ 上一级</button></div>';
    }

    if (dirs.length) {
      h += '<div class="list">';
      for (var i = 0; i < dirs.length; i++) {
        h += '<div class="row fold" data-go="' + esc(dirs[i].p) + '">' +
          '<span class="ic">▸</span><span class="li"><span class="t">' + esc(dirs[i].n) +
          '</span><span class="f">文件夹</span></span></div>';
      }
      h += '</div>';
    }

    if (total) {
      var show = opened[type] ? total : Math.min(5, total);
      h += '<div class="list">';
      for (var k = 0; k < show; k++) {
        var it = list[k];
        var size = fmtSize(it.s);
        h += '<div class="row" data-file="' + esc(it.f) + '">' +
          '<span class="li"><span class="t">' + esc(it.t || it.f) + '</span>' +
          '<span class="f">' + esc(it.f + (size ? ' · ' + size : '')) + '</span></span>' +
          '<button class="dl" data-dl="' + esc(it.f) + '">下载 ↓</button></div>';
      }
      h += '</div>';
      if (total > 5) {
        h += '<button class="more" data-more="1">' +
          (opened[type] ? '收起' : '更多（共 ' + total + ' 条）') + '</button>';
      }
    } else if (!dirs.length) {
      h += '<div class="empty">这个目录里没有录像</div>' + frame(dir);
    }

    sec.innerHTML = h;
    sec.dataset.dir = dir;
  }

  /* 事件都挂在段容器上，重绘不用重新绑 */
  function bind(type) {
    var sec = el('sec-' + type);
    if (!sec || sec.dataset.bound) return;
    sec.dataset.bound = '1';
    sec.addEventListener('click', function (ev) {
      var t = ev.target;
      while (t && t !== sec && !(t.getAttribute && (t.getAttribute('data-go') ||
        t.getAttribute('data-file') || t.getAttribute('data-path') ||
        t.getAttribute('data-dl') || t.getAttribute('data-more')))) {
        t = t.parentNode;
      }
      if (!t || t === sec) return;

      if (t.getAttribute('data-more')) {
        opened[type] = !opened[type];
        paint(type);
        return;
      }
      var dp = t.getAttribute('data-path');
      if (dp) {
        var nv = prompt(TITLE[type] + ' 在记录仪上的目录', dp);
        if (nv === null) return;
        nv = nv.trim();
        if (!nv) return;
        if (nv.charAt(0) !== '/') nv = '/' + nv;
        if (nv.charAt(nv.length - 1) !== '/') nv += '/';
        opened[type] = false;
        load(type, nv);
        return;
      }
      var go = t.getAttribute('data-go');
      if (go) { opened[type] = false; load(type, go); return; }
      var dl = t.getAttribute('data-dl');
      if (dl) { download(sec.dataset.dir || DEF[type], dl); return; }
      var f = t.getAttribute('data-file');
      if (f) preview(sec.dataset.dir || DEF[type], f);
    });
  }

  /* 记录仪网页服务很弱：刚连上第一次常抓空（返回 ok:0 或空应答），
     ok:0 是正常 HTTP 应答走 then，catch 兜不住。
     失败自动重试 2 次，间隔递增长一点，给设备缓过来的时间；
     断开了(seq 变了)就不再回填。后端还会用上次成功的列表兜底(带 stale)。 */
  /* 后端一个回合最长十几秒（记忆形态 6s + 补试 4.5s + 换形态 3s），
     间隔太密只会在冷却里空转，拉长到 3.5s / 7s。 */
  var RETRY_GAP = [0, 3500, 7000];
  function load(type, path, left) {
    if (left === undefined) left = RETRY_GAP.length - 1;
    var my = seq;
    var target = path || DEF[type];
    curPath = target;                             // 记下当前目录，复制按钮用它
    if (left === RETRY_GAP.length - 1) {
      state[type] = memoRead(target);             // 有上次结果先摆出来，别白屏
      paint(type);
    }
    var url = '/dvr/list?path=' + encodeURIComponent(target);
    function once() {
      return api(url).then(function (d) { return d; }, function (e) {
        return { ok: 0, err: '请求失败：' + ((e && e.message) || e) };
      });
    }
    function bad(d) { return !d || d.ok !== 1; }
    return once().then(function (d) {
      if (bad(d) && left > 0 && my === seq) {
        return new Promise(function (res) { setTimeout(res, RETRY_GAP[3 - left]); })
          .then(function () { return my === seq ? load(type, path, left - 1) : null; });
      }
      return d;
    }).then(function (d) {
      if (my !== seq || !d) return null;
      state[type] = bad(d) ? { ok: 0, err: (d && d.err) || '空应答' } : d;
      if (!bad(d)) memoWrite(target, d);
      paint(type);
      return state[type];
    });
  }

  function setup() {
    root.innerHTML = '<section id="sec-normal"></section><section id="sec-event"></section>';
    bind('normal');
    bind('event');
  }

  /* 两类顺序读：记录仪的网页服务同时只吃一两个连接，
     中间留 500ms 让它处理完上一个请求，避免连发两个抓空。 */
  function loadAll() {
    return load('normal').then(function () {
      return new Promise(function (res) { setTimeout(res, 500); });
    }).then(function () {
      return load('event');
    }).then(function () {
      var n = state.normal && state.normal.list ? state.normal.list.length : 0;
      var e = state.event && state.event.list ? state.event.list.length : 0;
      setStatus('已连接 ' + (curIp || '记录仪') + ' · ' + (direct ? '直连' : '中转')
        + ' · 普通 ' + n + ' · 事件 ' + e);
    });
  }

  function connect() {
    var my = ++seq;
    closePv();
    setStatus('正在找记录仪…');
    root.innerHTML = '<div class="empty">正在连接记录仪…</div>';
    api('/dvr/probe').then(function (d) {
      if (my !== seq) return null;
      if (!d || !d.ok) throw new Error((d && d.err) || '找不到记录仪');
      curIp = d.ip || '';
      el('ip').textContent = curIp || '—';
      return probeDirect(curIp).then(function (ok) {
        if (my !== seq) return null;
        direct = ok;
        notify(true, direct);
        setup();
        setStatus('已连接 ' + curIp + ' · ' + (direct ? '手机直连' : '经车机中转') + ' · 读取目录…');
        return loadAll();
      });
    }).catch(function (e) {
      if (my !== seq) return;
      notify(false);
      setStatus('没连上');
      root.innerHTML = '<div class="empty">' + esc(String((e && e.message) || e)) +
        '<br>记录仪要和车机在同一内网。' + FAILBTNS + '</div>';
    });
  }

  /* 诊断：7878 通不通、80 建连多久、根路径有没有字节回。
     「连不上」和「路径不对」在页面上长得一模一样，这个能把两者分开。 */
  function runDiag() {
    setStatus('正在诊断…');
    api('/dvr/diag', 25000).then(function (d) {
      var L = [];
      if (d.ip) L.push('IP ' + d.ip);
      L.push('7878 ' + (d.mark ? '通 ' + d.markMs + 'ms' : '不通'));
      var verdict;
      if (d.port80) {
        L.push('80 通 ' + d.connMs + 'ms');
        if (d.root === 'bytes') {
          L.push('根路径 ' + (d.status || '(无状态行)') + ' · ' + d.bytes + ' 字节');
          verdict = '设备在正常讲 HTTP，读不到应该是目录路径或请求时序的问题，重试一次通常就好。';
        } else if (d.root === 'closed') {
          L.push('根路径：连上后被立刻关闭');
          verdict = '80 端口接了连接却不回东西，记录仪的网页服务多半卡住了：给它断一下电，或把车机连的记录仪热点重连一次。';
        } else {
          L.push('根路径无应答 ' + (d.rootErr || '超时'));
          verdict = '80 端口接了连接但一个字都不回，记录仪的网页服务卡住了：断电重启记录仪最有效。';
        }
      } else {
        L.push('80 不通 ' + (d.port80Err || ''));
        verdict = '记录仪的文件服务在 80 端口，这个口不通就读不了列表和文件。先确认车机连的是记录仪的热点。';
      }
      root.innerHTML = '<div class="empty"><span class="rep">' + L.join('\n') +
        '</span><br><b>' + esc(verdict) + '</b>' + FAILBTNS + '</div>';
      setStatus('诊断完成');
    }, function (e) {
      toast('诊断失败：' + ((e && e.message) || e));
      setStatus('诊断失败');
    });
  }

  /* 自动扫描扫到的可能不是真正那台（同网段别的设备也开 7878/80），留个手动口。 */
  function fixIp() {
    var v = prompt('记录仪 IP（在记录仪屏幕上或路由器里能看到）', curIp || '192.168.1.1');
    if (v === null) return;
    v = v.trim();
    if (!v) return;
    api('/dvr/setip?ip=' + encodeURIComponent(v)).then(function () {
      toast('已指定 ' + v);
      connect();
    }, function () { toast('设置失败'); });
  }

  function disconnect() {
    seq++;
    closePv();
    curIp = '';
    curPath = '';
    direct = false;
    state.normal = null; state.event = null;
    el('ip').textContent = '—';
    root.innerHTML = '<div class="empty">已断开。点「连接」重新读取记录仪。</div>';
    setStatus('已断开');
    notify(false);
    api('/dvr/disconnect').catch(function () {});
    // 断开之后什么都不再做：不重连、不轮询、不预热，
    // 下次连只有用户自己点「连接」这一个入口。
  }

  el('back').addEventListener('click', function () {
    if (history.length > 1) history.back(); else location.reload();
  });
  el('connect').addEventListener('click', connect);
  el('disconnect').addEventListener('click', disconnect);
  /* 诊断/指定 IP 按钮在失败面板里，面板是整块重绘的，所以挂在 root 上做委托 */
  root.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== root && !(t.getAttribute && (t.getAttribute('data-diag') ||
      t.getAttribute('data-fixip')))) {
      t = t.parentNode;
    }
    if (!t || t === root) return;
    if (t.getAttribute('data-diag')) { runDiag(); return; }
    if (t.getAttribute('data-fixip')) fixIp();
  });
  /* 复制当前路径：拼成 http://<记录仪IP><目录>，粘到浏览器 80 端口直接看。
     代理读目录慢是弱设备 + 协议回退造成的，浏览器直连反而顺，这里就方便这么干。 */
  function copyText(s) {
    /* 原生剪贴板优先：http 页面拿不到 navigator.clipboard，execCommand 在壳里也不稳 */
    try {
      var N = window.CarRemoteNative;
      if (N && typeof N.copy === 'function') {
        if (N.copy(s) !== false) { toast('已复制：' + s); return; }
      }
      var ios = window.webkit && window.webkit.messageHandlers
        && window.webkit.messageHandlers.carRemote;
      if (ios) {
        ios.postMessage({ action: 'copy', text: s });
        toast('已复制：' + s);
        return;
      }
    } catch (e) {}
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = s; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, s.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? '已复制：' + s : '复制失败，请手动复制：' + s);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function () {
        toast('已复制：' + s);
      }, fallback);
    } else fallback();
  }

  el('copypath').addEventListener('click', function () {
    if (!curIp) { toast('先点「连接」'); return; }
    var p = curPath || DEF.normal;
    if (p.charAt(0) !== '/') p = '/' + p;
    copyText('http://' + curIp + p);
  });

  /* 打开就是「未连接」：不自动连、不后台连。
     记录仪是要用户主动点「连接」才会碰的端口，断开后也一直保持断开。 */
  notify(false);
})();
</script>
</body>
</html>
